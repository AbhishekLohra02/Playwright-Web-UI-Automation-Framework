name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Nightly regression at 02:00 UTC. SauceDemo is a third-party dependency,
    # so breakage between pull requests must still be caught.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.14.5

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check lint rules
        run: python -m ruff check --output-format github .

  ui-tests:
    name: Run Playwright UI tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run automated tests
        run: |
          mkdir -p reports test-results
          python -m pytest \
            --browser chromium \
            --numprocesses auto \
            --junitxml=test-results/junit.xml \
            --html=reports/report.html \
            --self-contained-html

      - name: Publish results to the job summary
        if: ${{ !cancelled() }}
        run: python scripts/junit_summary.py test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java for the Allure report
        if: ${{ !cancelled() }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the Allure report
        if: ${{ !cancelled() }}
        run: |
          curl -sSLo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.35.1/allure-2.35.1.tgz
          tar -xzf allure.tgz
          ./allure-2.35.1/bin/allure generate allure-results --clean -o allure-report

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-artifacts
          path: |
            allure-report/
            allure-results/
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14
