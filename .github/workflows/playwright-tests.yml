name: Playwright Tests

on:
  # Every branch gets the pipeline, so a change is verified where it is written
  # rather than only once it reaches main.
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    # Nightly regression at 02:00 UTC. SauceDemo is a third-party dependency,
    # so breakage between pull requests must still be caught.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # head_ref for pull requests, ref_name for pushes: both resolve to the plain
  # branch name, so a branch that also has a pull request open shares one group
  # instead of running the whole suite twice in parallel.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check lint rules
        run: python -m ruff check --output-format github .

      - name: Check types
        run: python -m mypy

      - name: Verify the traceability matrix is current
        run: |
          python scripts/traceability.py
          git diff --exit-code docs/TRACEABILITY.md

  ui-tests:
    name: UI tests (${{ matrix.browser }})
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Pull requests get fast Chromium feedback; the nightly run and manual
        # dispatches cover the full browser matrix.
        browser: >-
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && fromJSON('["chromium", "firefox", "webkit"]')
          || fromJSON('["chromium"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Install ${{ matrix.browser }}
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke tests
        run: |
          mkdir -p reports test-results
          python -m pytest -m smoke \
            --browser ${{ matrix.browser }} \
            --numprocesses auto \
            --junitxml=test-results/junit-smoke.xml

      - name: Run the full suite
        run: |
          python -m pytest \
            --browser ${{ matrix.browser }} \
            --numprocesses auto \
            --junitxml=test-results/junit.xml \
            --html=reports/report.html \
            --self-contained-html

      - name: Publish results to the job summary
        if: ${{ !cancelled() }}
        run: |
          echo "### ${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"
          python scripts/junit_summary.py test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-artifacts-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Publish the Allure report
    needs: ui-tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      - name: Restore the previous report history
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Carry the history forward
        run: |
          # Without this, every report starts from zero and the trend graphs
          # that make Allure worth having stay empty.
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the report
        run: |
          curl -sSLo allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.35.1/allure-2.35.1.tgz
          tar -xzf allure.tgz
          ./allure-2.35.1/bin/allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          keep_files: false
