name: Flake Detection

# The strategy commits to treating a flaky test as a defect rather than
# absorbing it with retries. That promise is only credible if something checks
# it, so this repeats the fast-feedback tests and fails if any run disagrees
# with another.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      repeat_count:
        description: "How many times to repeat each test"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  repeat-suite:
    name: Repeat the fast-feedback suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Repeat the suite
        run: |
          python -m pytest -m "smoke or sanity" \
            --browser chromium \
            --numprocesses auto \
            --count "${{ github.event.inputs.repeat_count || 5 }}" \
            --junitxml=test-results/junit-flake.xml

      - name: Publish results to the job summary
        if: ${{ !cancelled() }}
        run: |
          echo "### Flake detection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Any failure below is a test that does not behave the same way twice." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python scripts/junit_summary.py test-results/junit-flake.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: flake-detection-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
