line-length = 88
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "PT",   # pytest style
    "SIM",  # simplification
]

[lint.per-file-ignores]
# Fixtures are requested by name, so unused-looking arguments are intentional.
"conftest.py" = ["PT004"]

[format]
quote-style = "double"
